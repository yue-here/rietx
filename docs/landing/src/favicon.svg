<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="rietx">
  <!-- A Kalpha doublet on a baseline: the sharp line and its shoulder, which
       is the shape this package spends most of its code on.  Drawn as a filled
       profile rather than sticks because at 16 px sticks read as a bar chart.
       Authored as SVG rather than .ico so it is text (reviewable in a diff,
       like every other committed asset here) and so it can answer the
       browser's theme; a browser without SVG-favicon support falls back to the
       light fill, which is why the light colour is the declared one.
       The site's one favicon, the landing page's and the manual's (WP-2021), and
       the mark's authority: the manual's header copies its shapes inline, and
       `tests/test_manual.py` holds them equal.  The two fills are `--accent` in
       `tokens.css`; an SVG loaded as an icon reads no CSS variable, so they are
       literal here, and the same test holds the two equal. -->
  <style>
    .ink { fill: #c65d0a }
    @media (prefers-color-scheme: dark) { .ink { fill: #ff9d4d } }
  </style>
  <g class="ink">
    <path d="M2 26 C7 26 9 23 11.5 3.5 C14 23 16 26 21 26 Z"/>
    <path d="M17 26 C20 26 21.5 24 23 13 C24.5 24 26 26 29 26 Z"/>
    <rect x="1.5" y="25.5" width="29" height="3" rx="1.5"/>
  </g>
</svg>
