<title>%%TITLE%%</title>
<meta name="description" content="%%DESCRIPTION%%">
<link rel="icon" type="image/svg+xml" href="%%FAVICON%%">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
%%TOKENS%%
/* theme-dependent images: light by default, dark under either dark state */
.only-dark{display:none!important}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .only-light{display:none!important}
  :root:not([data-theme="light"]) .only-dark{display:block!important}
}
:root[data-theme="dark"] .only-light{display:none!important}
:root[data-theme="dark"] .only-dark{display:block!important}

*{box-sizing:border-box}
/* a pinned theme has to reach the form controls and the scrollbar too, or a page held
   dark under a light system keeps a light scrollbar and a light slider track */
html{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent-ink);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
a:hover{border-bottom-color:var(--accent)}
code,pre,kbd{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:1.5rem;line-height:1.25}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--rule)}
/* `gap` is the load-bearing part: `space-between` distributes *free* space, and a phone
   has none left here, so without it the brand and the first link butt together and read
   as one word ("rietxManual", measured at 390 px and below). A gap is a minimum. */
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:1.05rem;color:var(--ink);border:0}
.brand svg{width:22px;height:22px;fill:var(--accent)}
.top nav{display:flex;align-items:center;gap:22px;font-size:.95rem}
.top nav a{color:var(--ink-2);border:0}
.top nav a:hover{color:var(--accent-ink)}
/* The theme control carries a glyph and no word: the sun and the moon are `only-light`
   and `only-dark`, the same pair the figures use, so the button shows the theme in force
   without a line of script and follows the system until a click pins one. */
.tbtn{appearance:none;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink-2);
  border-radius:999px;width:30px;height:30px;padding:0;display:inline-grid;place-items:center;cursor:pointer}
.tbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.tbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* the bar at phone widths: nothing wraps, so the gaps give way before the words do */
@media (max-width:480px){
  .top .wrap{gap:12px}
  .top nav{gap:14px}
}
/* the last 40 px come out of the gutter, and out of every row's gutter together, or the
   brand stops sitting over the text below it */
@media (max-width:360px){.wrap{padding-left:16px;padding-right:16px}}

/* hero */
.hero{padding:64px 0 48px}
.hero h1{font-size:clamp(1.9rem,4.2vw,2.8rem);line-height:1.12;max-width:16ch}
.hero .lede{max-width:62ch;margin-top:18px;font-size:1.1rem;color:var(--ink-2)}
.hero .cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--rule-strong);
  background:var(--surface);color:var(--ink);font-family:inherit;font-weight:500;font-size:.95rem;cursor:pointer}
/* hover only where there is one: a touch screen keeps :hover on the last button tapped */
@media (hover:hover){.btn:hover{border-color:var(--accent);color:var(--accent-ink)}}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* A command is drawn as code, flat and tinted with no border, so it never passes for a
   button; its copy icon is the one control in it.  One click selects the whole command too. */
.cmd{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 5px 0 14px;border-radius:8px;
  background:var(--surface-2);font-family:var(--mono);font-size:.95rem;color:var(--ink)}
.hero .cmd{display:flex;width:fit-content;margin-bottom:24px}
.cmd .ps{color:var(--muted);user-select:none}
.cmd code{font-size:1em;user-select:all}
.icon-btn{appearance:none;border:0;background:none;width:30px;height:30px;padding:0;border-radius:6px;
  display:inline-grid;place-items:center;color:var(--muted);cursor:pointer}
.icon-btn:hover{color:var(--accent-ink);background:var(--surface-3)}
.copy svg,.qs-toggle .chev{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.copy .i-done,.copy.copied .i-copy{display:none}
.copy.copied .i-done{display:block}
.copy.copied{color:var(--ok)}

/* The two quickstarts, agent and Jupyter: a row of two toggle buttons over one panel at a
   time.  The buttons never move or hide, so switching is one click and closing is a click on
   the pressed one.  The panel takes no box of its own, since every bordered box in the hero is
   a button or a link; the pressed button carries the state instead. */
.qs-row{margin-top:12px;scroll-margin-top:76px}
.qs-tabs{display:flex;flex-wrap:wrap;gap:12px}
.qs-toggle .chev{margin-right:-4px;transition:transform .2s}
.qs-toggle[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.qs-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
/* No `display` here: a rule setting one would outrank `[hidden]`.  A closed panel is
   `hidden="until-found"`, which keeps an empty box where the browser supports it, so only an
   open one takes the margin.  The fade is progressive; a browser without @starting-style
   shows the panel at once. */
.qs-panel{max-width:680px;transition:opacity .2s ease}
.qs-panel:not([hidden]){margin-top:16px}
@starting-style{.qs-panel{opacity:0}}
/* Three layers, two type sizes.  What the person does is the panel's body text.  The choice
   that changes the prompt is a small label row.  The prompt is set apart on the tinted ground
   the install command uses, headed like the page's other code panes, with its copy button
   in its own corner. */
.qs-lead{font-size:.92rem;line-height:1.5;color:var(--ink-2);margin-bottom:14px}
.qs-src{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;margin-bottom:8px;font-size:.84rem;color:var(--muted)}
.qs-src label{position:relative;cursor:pointer}
.qs-src input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.qs-src label:hover span{color:var(--ink)}
.qs-src input:checked + span{color:var(--ink);text-decoration:underline 1.5px var(--accent);text-underline-offset:4px}
.qs-src input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.qs-src .dot{color:var(--faint)}
.qs-block{background:var(--surface-2);border-radius:8px;padding:6px 16px 14px}
.qs-head{display:flex;align-items:baseline;justify-content:space-between;
  font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.qs-copy{appearance:none;border:0;background:none;display:inline-flex;align-items:center;gap:6px;margin-right:-8px;padding:4px 8px;
  border-radius:6px;font:inherit;font-size:.84rem;letter-spacing:0;text-transform:none;color:var(--accent-ink);cursor:pointer}
.qs-copy:hover{background:var(--surface-3)}
.qs-prompt{margin-top:4px;font-size:.92rem;line-height:1.6;color:var(--ink)}
.qs-prompt p{margin:0 0 8px}
.qs-prompt ol{margin:0;padding-left:1.4em}
.qs-prompt li{margin:0 0 4px;padding-left:2px}
.qs-prompt li::marker{color:var(--muted)}
/* a command stays on one line; only the GitHub URL, too long for a phone, may break */
.qs-prompt code{font-size:.88em;white-space:nowrap}
.qs-prompt .v-git code{white-space:normal;overflow-wrap:anywhere}
/* one install line shows; without :has() the release one does, and the radios do nothing */
.qs-panel .v-git{display:none}
.qs-panel:has(input[value="git"]:checked) .v-git{display:inline}
.qs-panel:has(input[value="git"]:checked) .v-pip{display:none}
/* The Jupyter quickstart: one ruled row a notebook, its title and then its four links,
   which drop under the title where the row has no room for both. */
.nb-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.nb-list li{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 16px;
  padding:8px 0;border-bottom:1px solid var(--rule);font-size:.92rem;line-height:1.45}
.nb-title{color:var(--ink)}
.nb-links{display:flex;gap:14px;font-size:.84rem;white-space:nowrap}
/* On a phone the links always take their own line, so a short title does not sit beside them
   while a long one drops them underneath. */
@media (max-width:600px){.nb-title{flex:1 1 100%}}

/* sections */
.block{padding:56px 0;border-top:1px solid var(--rule)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:26px;max-width:70ch}
.sec-head p{color:var(--ink-2)}
.caption{color:var(--muted);font-size:.9rem;line-height:1.5;margin-top:14px;max-width:80ch}
.caption a{color:var(--ink-2)}

/* the rig */
.rig{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.rig-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.rig-head .what{color:var(--ink)}
.rig-head .who{color:var(--ink-2)}
.rig-head .pending{color:var(--muted)}
.rig-head .sep{color:var(--faint)}
.rig-head .ctl{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:min(100%,420px);flex:1 1 320px}
.play{appearance:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--surface);
  color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.play:hover{border-color:var(--accent);color:var(--accent-ink)}
.play svg{width:14px;height:14px;fill:currentColor}
input[type=range]{flex:1;accent-color:var(--accent);min-width:120px}
.readout{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap;
  flex:none;width:43ch;font-variant-numeric:tabular-nums}
.readout b{color:var(--ink);font-weight:500}
.rig-body{display:grid;grid-template-columns:minmax(300px,5fr) minmax(0,7fr)}
/* the pane: the prompt pinned on top, the run's log streaming under it.
   absolute in its cell, so neither ever sizes the row -- the panels do */
.tx-cell{position:relative;border-right:1px solid var(--rule);min-height:320px}
.tx{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--surface)}
.tx .lbl{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.tx code{font-size:.9em;background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:0 3px}
.tx b{font-weight:600;color:var(--ink)}
.tx .cut{color:var(--faint)}
.tx .pending{color:var(--muted);font-style:italic}
.prompt{padding:14px 18px 15px;border-bottom:1px solid var(--rule);background:var(--surface-2);
  font-size:.82rem;line-height:1.5;color:var(--ink-2)}
.prompt p{margin:0 0 7px;white-space:pre-wrap}
.prompt p:last-child{margin-bottom:0}
.con{overflow:auto;padding:12px 18px 16px;font-family:var(--mono);font-size:.72rem;line-height:1.55;color:var(--muted)}
.con .ln{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.con .ln.warn{color:var(--warn)}
.con .ln.now{color:var(--ink)}
.con .gas{display:flex;align-items:center;gap:8px;margin:10px 0 6px;color:var(--faint);letter-spacing:.03em}
.con .gas::after{content:"";flex:1;border-top:1px solid var(--rule-strong)}
.con .gas i{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.con .elide{display:flex;align-items:center;gap:10px;margin:10px 0;color:var(--faint)}
.con .elide::before,.con .elide::after{content:"";flex:1;border-top:1px dashed var(--rule-strong)}
.con .rep{font-family:var(--sans);font-size:.84rem;line-height:1.5;color:var(--ink-2);margin:14px 0 0}
.con .rep p{margin:0 0 8px}
.con .note{font-family:var(--sans);color:var(--faint);font-size:.74rem;line-height:1.45;margin:12px 0 0}
.panels{display:grid;grid-template-rows:auto auto auto;gap:0;padding:8px 12px 10px}
.panel{position:relative}
.panel canvas{display:block;width:100%}
#heat{height:224px}#pattern{height:216px}#frac{height:256px}
.legend{display:flex;flex-wrap:wrap;gap:3px 16px;padding:2px 10px 0 44px;font-size:.74rem;color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:5px}
.legend .n{display:inline}
.legend i{width:14px;height:0;border-top:2px solid var(--c);display:inline-block}
@media (max-width:860px){
  .rig-body{grid-template-columns:1fr}
  .rig-head .ctl{flex-wrap:wrap;gap:8px 12px}
  .readout{flex:1 1 100%;width:auto;padding-left:46px;white-space:normal}
  .tx-cell{border-right:0;border-bottom:1px solid var(--rule);height:430px}
  /* the prompt scrolls on a narrow screen; a sticky fade says so without cutting a line dead */
  .prompt{max-height:190px;overflow:auto}
  .prompt::after{content:"";display:block;position:sticky;bottom:-15px;height:22px;margin-top:-22px;
    background:linear-gradient(transparent,var(--surface-2))}
}
@media (max-width:600px){
  .con{font-size:.66rem}
  .rig-head .sep{display:none}
}

/* example */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.codebox{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.codebox .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--rule);
  font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.codebox pre{margin:0;padding:14px 16px;overflow-x:auto;font-size:.78rem;line-height:1.5;color:var(--ink)}
.codebox pre.out{color:var(--ink-2)}
.k{color:var(--accent-ink)}.s{color:var(--p2)}.c{color:var(--faint)}.w{color:var(--warn)}.g{color:var(--ok)}
.fig{margin:22px auto 0;max-width:760px}
.fig img{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.fig .only-dark{background:var(--surface)}
.fig figcaption{color:var(--muted);font-size:.9rem;line-height:1.5;margin-top:10px}
@media (max-width:760px){.two{grid-template-columns:1fr}}

/* gui */
.shot{margin:0 auto;max-width:980px}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--rule-strong);border-radius:10px;box-shadow:var(--shadow)}
.shot figcaption{color:var(--muted);font-size:.9rem;line-height:1.5;margin-top:10px;max-width:80ch}

/* features */
.feat{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 40px}
.feat li{padding:12px 0;border-top:1px solid var(--rule);line-height:1.45}
.feat li strong{font-weight:600;display:block;margin-bottom:2px}
.feat li span{color:var(--ink-2);font-size:.95rem}
@media (max-width:700px){.feat{grid-template-columns:1fr}}

/* validation */
.vt{width:100%;border-collapse:collapse;font-size:.92rem;line-height:1.45}
.vt th{text-align:left;font-weight:600;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
  padding:0 12px 10px 0;border-bottom:1px solid var(--rule-strong)}
.vt td{vertical-align:top;padding:12px 12px 12px 0;border-bottom:1px solid var(--rule)}
.vt td:first-child{font-weight:500}
.vt td:nth-child(3){font-family:var(--mono);font-size:.84rem;white-space:nowrap}
.vt td:last-child{color:var(--ink-2)}
.tablewrap{overflow-x:auto}

/* the essay (why.html) */
.essay{max-width:66ch;margin:0 auto;padding:56px 0 64px}
.essay h1{font-size:clamp(1.9rem,4.2vw,2.6rem);line-height:1.15;margin-bottom:28px}
.essay p{margin:0 0 1.1em;font-size:1.06rem;line-height:1.7;color:var(--ink-2)}
.essay .sig{color:var(--ink);margin-top:1.6em}

/* footer */
footer{border-top:1px solid var(--rule);padding:32px 0 48px;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline}
footer a{color:var(--ink-2)}
footer .note{flex-basis:100%;margin-top:8px;font-size:.82rem;color:var(--faint)}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
/* ---------- theme: the system's, until a click pins one ---------- */
// There is no third state to choose: a first load follows the system because nothing is
// stored, and a stored value is one of the two.  (An "auto" or "system" left over from a
// three-way control reads as nothing stored, which is what it meant.)  The glyph is CSS
// -- `only-light` / `only-dark` on the two svgs -- so only the label is set here.  It runs
// straight after the bar, before any page's own script, so a page drawing in the theme's
// colours reads the pinned one on its first frame; a later change reaches it as a
// mutation of `data-theme`.
// The choice is stored under the manual's keys, pydata-sphinx-theme's `mode` and `theme`,
// so one click holds on both pages of the origin (WP-2021).  `rietx-theme`, this page's
// own key before that, is read once where `mode` pins nothing -- the manual writes `auto`
// there on every load, so `mode` being set is no sign of a choice -- carried over to the
// two keys, and removed.
(function(){
  "use strict";
  const root = document.documentElement, tb = document.getElementById("theme");
  const mqDark = window.matchMedia("(prefers-color-scheme: dark)");
  const isTheme = s => s === "light" || s === "dark";
  let pinned = null;
  try {
    const mode = localStorage.getItem("mode"), old = localStorage.getItem("rietx-theme");
    if (isTheme(mode)) pinned = mode;
    else if (isTheme(old)) {
      pinned = old;
      localStorage.setItem("mode", old); localStorage.setItem("theme", old);
    }
    localStorage.removeItem("rietx-theme");
  } catch (e) {}
  const isDark = () => pinned ? pinned === "dark" : mqDark.matches;
  function applyTheme(){
    if (pinned) root.setAttribute("data-theme", pinned); else root.removeAttribute("data-theme");
    const to = "Switch to the " + (isDark() ? "light" : "dark") + " theme";
    tb.setAttribute("aria-label", to);
    tb.setAttribute("title", to);
  }
  applyTheme();
  tb.addEventListener("click", () => {
    pinned = isDark() ? "light" : "dark";
    try {
      localStorage.setItem("mode", pinned); localStorage.setItem("theme", pinned);
    } catch (e) {}
    applyTheme();
  });
  mqDark.addEventListener("change", applyTheme);   // the label, while nothing is pinned
})();
</script>
