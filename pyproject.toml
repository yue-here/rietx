[build-system]
# The floor is PEP 639: `license = "MIT"` plus a `license-files` *list* are only
# read as such from hatchling 1.27.  Below it the same two lines still build a
# wheel, silently, whose metadata carries the deprecated `License: MIT` free
# text at Metadata-Version 2.3 instead of `License-Expression: MIT` at 2.4+
# (measured, 1.26.3 vs 1.27.0), so an unpinned backend makes the licence PyPI
# displays a function of whatever the release runner happened to resolve.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rietx"
# The next release's .dev0, moved after each cut: the convention is CLAUDE.md's
# (WP-1540), the procedure docs/RELEASING.md's § Cutting a release, step 1.
# *Which* release that is stays out of this comment — naming it is what rotted
# the note this replaces, which still said v1.0 was open two releases after it
# shipped.  The value itself is stamped into every RefinementResult's Provenance
# and every history node, so a stale one mislabels the provenance of real
# results, and the release workflow refuses a tag that disagrees with it.
version = "1.8.0.dev0"
description = "Python-API-first analysis and Rietveld refinement of powder diffraction data"
readme = "README.md"
license = "MIT"
# LICENSE-3RD-PARTY.md carries the MIT texts of the JS packages bundled in the
# committed GUI dist (Svelte's runtime, CodeMirror and its helpers) — the
# wheel ships their code, so it ships their licences (ATTRIBUTION.md has the
# provenance table).
license-files = ["LICENSE", "LICENSE-3RD-PARTY.md"]
requires-python = ">=3.11"
authors = [{ name = "Yue Wu" }, { name = "Michael W. Gaultois" }]
keywords = ["rietveld", "powder-diffraction", "neutron-diffraction", "xrd",
            "crystallography", "refinement"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    # The Windows row is a claim with a pre-upload gate, asserted by a person
    # rather than by a workflow: docs/RELEASING.md step 4 (WP-1003).
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "gemmi>=0.6.5",
    # 2.8 corrects the time-reversal flags of UNI 282-284, the three magnetic
    # groups 2.7.0 could not identify from their own operators (WP-1452).
    "spglib>=2.8",
    # The compiled kernel tier (WP-1115, in Rust since WP-1940): ~2x on a
    # four-phase Cu Kα refinement and ~1.35x on a synchrotron one.  It is one
    # abi3 wheel per platform, built from kernels/ in this repository.  It is
    # required with no platform markers, and the crate publishes no sdist, so
    # pip fails loudly where no wheel exists rather than installing a rietx
    # that is silently slower.
    #
    # The import stays soft: `--no-deps` or a distro package without it still
    # yields a working install running the numpy expressions, and that install
    # warns once and says why in `capabilities()`.  `RIETX_COMPILED=0`
    # (`_about.COMPILED_ENV`) switches the tier off at runtime.
    #
    # The range is `model.compiled.KERNEL_ABI`, the kernel interface number.
    # A major release of the wheel is a breaking interface change.  A new
    # kernel is a minor release, and raises this floor.  docs/RELEASING.md
    # § The kernel wheel has the procedure.
    "rietx-kernels>=1,<2",
    # Required since WP-1545, an extra (`viz`) before it.  A figure is how most
    # people read a fit, and every tutorial and the landing page draw one, so a
    # base install that could not was the install people were judged by.  The
    # cost is ~58 MB with its dependencies (pillow, fonttools, contourpy,
    # kiwisolver, pyparsing, cycler) against ~124 MB for the rest.
    # `viz.plots._pyplot` still imports it lazily, so `import rietx` pays
    # nothing for it.
    #
    # The floor is two floors.  On cp314 it is where matplotlib's wheels first
    # cover the interpreter (3.10.5), so a 3.14 user who pins the floor still
    # gets a wheel.  Below 3.14 it is 3.10.0, because that is what Google
    # Colab preinstalls (googlecolab/backend-info, 2026-10-09) and Colab
    # imports matplotlib at startup: a floor above it makes `%pip install
    # rietx` upgrade an imported module and ask for a runtime restart before
    # the tutorial's next cell.  Every plotting, tutorial and example test
    # passed on 3.10.0.
    "matplotlib>=3.10; python_version<'3.14'",
    "matplotlib>=3.10.5; python_version>='3.14'",
]

[project.optional-dependencies]
# Empty since WP-1545, which made matplotlib a dependency, and kept so
# `pip install 'rietx[viz]'` still works, as `gui` below is.
viz = []
# Empty since WP-1462, and kept so `pip install 'rietx[gui]'` still works: the
# built frontend is committed under src/rietx/gui/static with every library it
# draws with (uPlot, and the structure viewer's own renderer), so the GUI needs
# nothing a base install lacks, and installing it never needs node.
gui = []
jax = ["jax>=0.4.30"]
# EXPERIMENTAL, and deliberately not part of [dev]: torch is a ~500 MB
# dependency whose CPU Jacobian is ~10x slower than the analytic numpy one and
# whose Apple-GPU path is slower still (measured — docs/milestones/v0.4.md).
# It is kept as an independent opinion in the Jacobian-agreement matrix and as
# the route to using the forward model as a differentiable layer; nobody
# running refinements needs it installed.
torch = ["torch>=2.2"]
docs = [
    "sphinx>=7.4",
    # Stays a direct pin: myst-nb asks only for myst-parser>=1, and conf.py's
    # `myst_*` settings are myst-parser's.
    "myst-parser>=3",
    # The tutorial notebooks as manual pages (WP-1916), with execution off.
    "myst-nb>=1.1",
    "sphinxcontrib-bibtex>=2.6",
    # Part 1's diagrams.  >=2.1 because that is where the extension's own
    # theme detection reads `body[data-theme]` and re-renders on a
    # MutationObserver — which is exactly how furo signals its light/dark
    # toggle, so the diagrams follow the toggle with no custom JS here.
    "sphinxcontrib-mermaid>=2.1",
    # Part 1's installation tabs (WP-1126): one chapter, three operating
    # systems, two installers.
    "sphinx-design>=0.6",
    "furo>=2024.1",
]
# What executes a notebook headless (WP-1544): the display tests run an
# object through IPython's own formatter, and the tutorials (WP-1545) are
# built and checked by executing them.  Not needed to *use* a notebook,
# which brings its own kernel.
notebooks = ["ipykernel>=6.29", "nbclient>=0.10", "nbformat>=5.10"]
dev = [
    # Two user-facing extras ride along rather than being restated here: docs
    # so tests/test_manual.py builds the theory manual in the standard suite
    # instead of importorskip-ing out, and notebooks so the display tests and
    # the tutorials meet a real kernel.
    "rietx[docs,notebooks]",
    "pytest>=8",
    # `-n auto --dist loadgroup` is how the suite is meant to be run; the
    # expensive shared fixtures are pinned to a worker by xdist_group marks
    # (tests/conftest.py), so this is not an optional accelerator
    "pytest-xdist>=3.6",
    "hypothesis>=6",
    "ruff",
    # TEST ORACLE ONLY, for crystallography/representation/irreps.py: an independent
    # implementation of the small irreps of a little group (Neto's subgroup
    # chain, where ours splits the twisted regular representation).  It is
    # deliberately not a runtime dependency and is never imported outside
    # tests/test_magnetic_irreps.py, where every test using it carries
    # `_oracle` in its name and `pytest.importorskip("spgrep")`, so the suite
    # is green without it.  BSD-3 (Kohei Shinohara); pulls in hsnf (MIT).
    "spgrep>=0.7",
]

[project.urls]
Homepage = "https://github.com/yue-here/rietx"
Documentation = "https://rietx.org/manual.html"

[project.scripts]
rietx = "rietx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rietx"]
# Hatchling takes every non-ignored file under a package directory, so the three
# subsystem rulebooks (gui/, indexing/, io/) were installing into site-packages
# and an agent read one there as the package's own documentation (WP-1110 item
# 20).  They address a session *changing* rietx and cite tests/, docs/wp/ and
# commands no installed copy has.  The document written for a consumer ships on
# purpose and is the force-include below.
exclude = ["**/CLAUDE.md"]

[tool.hatch.build.targets.wheel.force-include]
# The agent skill ships inside the wheel (WP-1003, retargeted by WP-1304): an
# agent's sandbox may have no network, so `rietx skill --path` must resolve
# without one.  docs/skill/rietx/ stays the one authority; this is a build-time
# copy, absent from an editable install, where `skill_path()` falls back to the
# repository tree.  The two committed copies (.agents/skills/, .claude/skills/)
# are for sessions working *in* this repository and are not shipped.
"docs/skill/rietx" = "rietx/data/skill/rietx"

[tool.hatch.build.targets.sdist]
# tests/ stays out: the QARR round-robin patterns are not redistributable
# outside the IUCr distribution, and the data + darwin-only goldens are
# ~25 MB nobody installs.  gui/ is the TS workspace; the wheel carries the
# committed build output under src/rietx/gui/static instead.
# Leading slashes are load-bearing: these are gitignore-style patterns, and a
# bare "gui" also matched src/rietx/gui — which silently dropped the GUI
# server's *python* modules from every build while .gitignore's
# `!src/rietx/gui/static/**` negation kept the static assets, so the wheel
# imported until capabilities() touched gui.textdoc (caught by the fresh-venv
# smoke test, 2026-08-16).  /gui/index.html still needs naming beside /gui:
# its own `!` negation (vite's entry module) outranks the directory exclude.
# kernels/ is a distribution of its own, rietx-kernels, built from its own tag
# (WP-1940).
exclude = ["/tests", "/gui", "/gui/index.html", "/kernels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto --dist loadgroup` belongs on the command line and deliberately not
# here (CLAUDE.md § Commands): in addopts it would make a bare
# `pytest tests/x.py::y` parallel too, and `-s` and pdb stop working.
addopts = "-q"
markers = ["slow: long-running acceptance tests on real data"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY"]
ignore = ["E501"]
