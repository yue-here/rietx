# The major version is the kernel interface number, KERNEL_ABI: rietx pins
# `rietx-kernels>=N.M,<N+1` and re-checks the integer at import (WP-1940).
# Bump it with any change to a kernel's name, arguments or output planes.  A
# new kernel bumps the minor, and N.M is the minor that added the newest
# kernel rietx calls.
[package]
name = "rietx-kernels"
version = "1.4.0"
edition = "2024"
license = "MIT AND BSL-1.0"
description = "The compiled kernels of rietx: its model and its structure figure"
repository = "https://github.com/yue-here/rietx"
publish = false

[dependencies]
numpy = "0.29.0"
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py311"] }

[lib]
name = "rietx_kernels"
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
lto = "fat"
