# Dependabot watches the two dependencies the package vendors: uPlot and
# svgcanvas, which the charts' SVG export draws through (WP-1461).
#
# Each is pinned exactly in gui/package.json, and `npm --prefix gui run build`
# copies it into src/rietx/viz/static (gui/scripts/vendor.py). Nothing else
# would notice a new release: a Python dependency moves when pip resolves it,
# while a vendored copy stays frozen until someone moves the pin.
#
# A bump's pull request stays red until someone runs the build, because the
# lockfile is in the dist's digest (tests/test_gui_dist.py). Running it also
# refreshes the vendored copy, so the pin and the copy land together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /gui
    schedule:
      interval: weekly
    allow:
      - dependency-name: uplot
      - dependency-name: svgcanvas
