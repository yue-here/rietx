name: nightly

# Everything the per-push gate leaves out, once a night.  Until WP-1003's
# visibility flip this was two workflows on a free-tier budget — weekly.yml
# (full suite + the 3.11/3.14 edges) and monthly.yml (macOS, torch) — and the
# collapse back into one nightly is the un-shaping both files promised.  Since
# WP-1547 ci.yml runs the two ends of the support window per push, and the
# middle runs here, in `middle`.
#
# No run or monthly totals here — a cross-workflow total written in a comment
# rots (one sat at 303 against a measured ≈495); read spend from the Actions
# usage page or `gh run list`, never from comments.
#
# What each job is *for*:
#
# * `full` is the only place the slow real-data acceptance suites run in CI,
#   and it installs `[dev,jax]`, so it *is* the scheduled jax coverage.
# * `middle` is the fast suite on Python 3.12 and on 3.13, which left ci.yml's
#   per-push matrix (WP-1547).  A break on a middle version alone shows here,
#   and these two jobs and `windows` are the release gate (docs/RELEASING.md
#   step 4).  `full` is not, though it runs 3.13 too: it was red on 27 of 60
#   nightlies to 2026-10-10, each stretch one acceptance test failing on
#   every version, and a 3.13 break would hide inside it.
# * `windows` backs the OS classifier row (WP-1002 measured the fast suite
#   green there after real fixes, guarded by tests/test_portability.py) and
#   is the pre-upload gate for any release claiming Windows.
# * `macos` is the closest any runner gets to the bit-identity goldens'
#   capture machine, and close is all it gets — it reports the golden
#   comparison and fails only if the goldens skip (see that step's comment).
#   The fast suite only: the slow acceptance is already covered on Linux.
# * `torch` is an independent opinion in the Jacobian-agreement matrix
#   (WP-0408), not a supported runtime.

on:
  schedule:
    # 06:00 UTC nightly
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      full_macos:
        description: "Run the full suite (incl. slow acceptance) on macOS — a release check, or after a change to the peak chain"
        type: boolean
        default: false

env:
  MPLBACKEND: Agg

jobs:
  full:
    name: full suite (Linux, incl. slow acceptance)
    runs-on: ubuntu-latest
    # raised from 90 after measured drift 44:21 -> 77:52 (WP-1060), and from
    # 120 after the drift past it was investigated rather than silently
    # raised (WP-1003): the 2026-08-16 run *completed* at 1h57 — no hang, the
    # suite grew, and 77 min of it is indexing-acceptance fixture setup on
    # the 2-core runner (top four --durations rows). The durable lever is
    # narrowing what those fixtures search (the post-1003 indexing work);
    # this guard stays a runaway guard, calibrated above the measured runtime
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev,jax]"
      - name: Record the environment
        run: .venv/bin/python -m tests.record_environment
      - name: Full suite
        # the bit-identity goldens skip here — pinned to darwin/arm64
        # (tests/test_backend_shim.py, GOLDEN_PLATFORM); the macos job reports
        # the comparison, and no CI runner reproduces their capture machine
        run: .venv/bin/python -m pytest -n auto --dist loadgroup --durations=25
      - name: Upload obs/calc/diff plots
        # every test refinement writes them (CLAUDE.md's Tests convention);
        # Rwp hides locally-bad fits, so on a failure these are the first
        # thing to look at
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-linux
          path: tests/output/
          if-no-files-found: warn
          retention-days: 7

  middle:
    name: fast suite (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - name: Record the environment
        run: .venv/bin/python -m tests.record_environment
      - name: Fast suite
        # what ci.yml's py3.12 and py3.13 legs ran until WP-1547, unsharded:
        # the nightly has no one waiting on it
        env:
          RIETX_DOCS: skip
        run: .venv/bin/python -m pytest -n auto --dist loadgroup -m "not slow"

  windows:
    name: fast suite (Windows)
    runs-on: windows-latest
    # raised from 45 (WP-2036): the same suite ran 17-25 min and 40-45 min on
    # runners a few hours apart, 2.2x slower at every point of the timeline
    # rather than in one test, so 45 fired on runner speed; 120 is 2.7x the
    # slowest pass measured and stays a runaway guard
    timeout-minutes: 120
    defaults:
      run:
        # git-bash, so the python -c quoting below matches the other jobs;
        # the interpreter path is still Windows's Scripts/ layout
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev]"
      - name: Record the environment
        run: .venv/Scripts/python -m tests.record_environment
      - name: Fast suite
        run: .venv/Scripts/python -m pytest -n auto --dist loadgroup -m "not slow"

  macos:
    name: macOS (goldens' capture platform)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev,jax]"
      - name: Record the environment
        run: .venv/bin/python -m tests.record_environment
      - name: Suite
        # the bit-identity gate is deselected and run as its own step below.
        # Measured 2026-07-29: this runner does *not* reproduce the capture
        # machine's bits, even at identical numpy/scipy/Accelerate — see that
        # step's comment.  Requiring them here would redden the tree nightly
        # for a one-ulp difference in a system math library.
        run: |
          DESELECT="--deselect tests/test_backend_shim.py::test_numpy_path_bit_identical_to_golden"
          if [ "${{ inputs.full_macos }}" = "true" ]; then
            .venv/bin/python -m pytest -n auto --dist loadgroup --durations=25 $DESELECT
          else
            .venv/bin/python -m pytest -n auto --dist loadgroup -m "not slow" $DESELECT
          fi
      - name: Bit-identity goldens — informational, and a check they did not skip
        # What this step can and cannot claim, measured on the first run:
        # 7 of 8 toy states are bit-identical here, and `toy_rich:y_calc`
        # differs by 1.4210854715202004e-14 — *exactly* one ulp at a value in
        # [64,128), on a single element.  The runner reports the same numpy
        # 2.5.1, scipy 1.18.0 and Accelerate as the capture machine, and local
        # runs at 1/2/4/8 BLAS threads are bit-stable, so the discriminator is
        # the system math library (macOS image version) and nothing Python can
        # fingerprint.  Compare Linux x86-64: all 8 states, up to ~1100 ulp.
        #
        # So no CI image asserts these bits — that is a documented gap, the
        # same shape as the Apple-GPU one.  What this step *does* enforce is
        # that they did not silently skip, because a skip and a pass look
        # identical in a summary line; a numeric mismatch is reported as a
        # warning so drift (say 5 states, or a large delta) stays visible.
        run: |
          set +e
          out=$(.venv/bin/python -m pytest tests/test_backend_shim.py -k bit_identical -m "not slow" -rs)
          echo "$out"
          if echo "$out" | grep -qE "skipped|no tests ran"; then
            echo "::error::the goldens skipped on darwin/arm64 — the platform pin is broken, and nothing anywhere is checking them"
            exit 1
          fi
          if echo "$out" | grep -qE "^[0-9]+ failed"; then
            echo "::warning::goldens differ on this runner — expected at ~1 ulp; investigate only if the count or size grew (see tests/data/README.md)"
          fi
          exit 0
      - name: Upload obs/calc/diff plots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-macos
          path: tests/output/
          if-no-files-found: warn
          retention-days: 7

  torch:
    # EXPERIMENTAL backend: an independent opinion in the Jacobian-agreement
    # matrix, not a supported runtime.  CPU fp64 only —
    # torch.backends.mps.is_available() is False on hosted macOS runners
    # (virtualised, no Metal device), so every `torch-mps` assertion self-skips
    # in CI and the Apple-GPU evidence for the WP-0403 fp32-column policy stays
    # maintainer-machine-only.  Do not read this job green as "MPS verified".
    name: torch agreement matrix (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev,jax,torch]"
      - name: Every backend installed at once
        # Deliberately *not* `-n auto`: tests/test_cross_backend.py caches one
        # built Jacobian callable per (config, backend) so the fp32 rows reuse
        # the compiled one, which halved that file's runtime (WP-0404).  xdist
        # would give each worker its own cold cache and pay every compile
        # again.  If this step ever needs to be faster, measure both — do not
        # assume parallel wins.
        run: |
          .venv/bin/python -m pytest \
            tests/test_cross_backend.py \
            tests/test_backend_conformance.py \
            tests/test_backend_torch.py \
            tests/test_backend_jax.py \
            tests/test_backend_shim.py
      - name: Assert the MPS rows really did skip rather than silently vanish
        run: .venv/bin/python -c "import torch; assert not torch.backends.mps.is_available(), 'hosted runner grew a Metal device — promote the MPS assertions out of maintainer-only status'"
